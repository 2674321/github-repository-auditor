[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-auditor"
version = "0.1.0"
description = "Auditor local de repositorios Git/GitHub — evalúa calidad, documentación, estructura y seguridad básica"
readme = "README.md"
license = {text = "Pendiente de definición"}
requires-python = ">=3.10"
authors = [
    {name = "Patricio Varela C.", email = "2674321@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["git", "github", "audit", "repository", "health"]

[project.scripts]
repo-auditor = "repository_auditor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
